site_name: Artificial Lift Optimization
site_description: ESP, rod pump and gas lift performance tracking and failure prediction using machine learning.
repo_url: https://github.com/kcabrera83/artificial-lift-optimization
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
